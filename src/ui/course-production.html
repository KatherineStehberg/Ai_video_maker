<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producción de cursos — AI Video Maker</title>
<style>body{font:16px Arial,sans-serif;color:#003366;background:#fff;margin:0;padding:32px;max-width:1100px}h1{font-size:28px}a{color:#003366}section{border:1px solid #d5e1eb;border-radius:10px;padding:18px;margin:16px 0}p{line-height:1.5}small{display:block;color:#526579;margin:10px 0}.status{font-weight:bold}.links a{margin-right:20px}#environment{background:#eef4f8;padding:16px;border-radius:8px}</style></head>
<body><a href="/editor.html">← Volver al editor</a><h1>Videos de Language Center Chile</h1><p>La cola produce un video a la vez. Cuando esté listo, abre «Revisar edición». Los videos siguen pendientes de revisión antes de utilizarlos en el curso.</p><p id="environment">Comprobando producción…</p><main id="items"></main>
<script type="module">
const labels={pending:'En cola',submitting:'Preparando trabajo',rendering:'Produciendo',review_ready:'Listo para revisión final',blocked:'Bloqueado'};
async function update(){try{const response=await fetch('/api/course-production');const data=await response.json();if(!response.ok)throw new Error(data.error||'Consulta fallida');
 document.querySelector('#environment').textContent=data.startupError||(!data.environment?'Comprobando entorno…':data.environment.ok?'Producción local activa. Voz: '+data.environment.voice.name:(data.environment.reasons||[]).join(' '));
 const main=document.querySelector('#items');main.replaceChildren();for(const item of data.entries){const card=document.createElement('section');const title=document.createElement('h2');title.textContent=item.title;card.append(title);const meta=document.createElement('small');meta.textContent=item.course.courseName+' · '+item.id;card.append(meta);const state=document.createElement('p');state.className='status';state.textContent=labels[item.status]||item.status;card.append(state);if(item.progress){const p=document.createElement('p');p.textContent=item.progress.operacion||item.progress.etiqueta||'';card.append(p);}if(item.error){const p=document.createElement('p');p.textContent=item.error;card.append(p);}if(item.status==='review_ready'){const links=document.createElement('p');links.className='links';for(const [text,href] of [['Revisar edición',item.reviewUrl],['Ver video','/course-video.html?id='+encodeURIComponent(item.id)]]){const a=document.createElement('a');a.textContent=text;a.href=href;links.append(a);}card.append(links);const notes=document.createElement('small');notes.textContent='Comprobación técnica completada. Revisa pronunciación, subtítulos y edición. '+(item.warnings||[]).join(' ');card.append(notes);}main.append(card);}
 }catch(error){document.querySelector('#environment').textContent='No se pudo consultar la cola: '+error.message;}}
await update();setInterval(update,15000);
</script></body></html>
